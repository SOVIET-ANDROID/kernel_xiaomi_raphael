name: Build Android Kernel for raphael

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '是否发布到 Release（输入 true 或 false）'
        required: true
        default: 'true'
  push:
    branches: [ "13.0-DSP" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          repository: kmerc224/kernel_xiaomi_raphael
          ref: 13.0-DSP
          fetch-depth: 0

      - name: 安装编译依赖（适配 Ubuntu 24.04）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc \
            libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler \
            python3 python-is-python3

      - name: 设置缓存 (Ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: 获取 Clang 工具链 (LineageOS 19.1 预编译版，稳定可靠)
        run: |
          mkdir -p toolchain
          cd toolchain
          # 从 LineageOS 的 GitHub 仓库下载，专为 Android 12/13 内核适配
          wget -q https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-19.1.tar.gz
          tar xzf lineage-19.1.tar.gz --strip-components=1
          cd ..

      - name: 获取 GCC 工具链 (aarch64)
        run: |
          mkdir -p gcc
          cd gcc
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 .
          cd ..

      - name: 获取 AnyKernel3 (用于打包)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: 配置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$PWD/gcc/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "DEFCONFIG=raphael_defconfig" >> $GITHUB_ENV
          echo "KERNEL_OUT=$PWD/out" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchain/bin:$PWD/gcc/bin:$PATH" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 准备编译
        run: |
          make O=out ARCH=arm64 $DEFCONFIG

      - name: 编译内核
        run: |
          export PATH=$PATH
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
        timeout-minutes: 120

      - name: 验证编译结果
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "内核镜像编译失败！"
            exit 1
          fi
          echo "内核镜像编译成功！"

      - name: 使用 AnyKernel3 打包
        run: |
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dts/qcom/*.dtb anykernel/ 2>/dev/null || true
          cd anykernel
          zip -r9 "../Kernel-raphael-${GITHUB_SHA:0:7}.zip" * -x .git README.md
          cd ..

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-raphael
          path: Kernel-raphael-*.zip

      - name: 上传到 Release (可选)
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Kernel-raphael-*.zip
          tag_name: v${{ github.run_number }}
          name: "Kernel Build ${{ github.run_number }}"
          body: |
            - 内核分支: `13.0-DSP`
            - 提交哈希: `${{ github.sha }}`
            - 编译器: LineageOS Clang r416183b
            - 目标设备: Redmi K20 Pro (raphael)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
